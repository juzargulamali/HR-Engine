name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (packages/domain)
        run: npm test

      - name: Build (apps/web)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: E2E project isolation — the recovery-windows specs must never be part of a Production project
        run: |
          set -e
          cd packages/e2e-tests
          if npx playwright test --list --project=read-only --project=mobile-smoke --project=mutating --project=baseline --project=reconciliation 2>&1 | grep -qE "recovery-windows|local-stack"; then
            echo "::error::A recovery-windows or local-stack spec is matched by a Production Playwright project. They must run only under the dedicated preview-recovery-windows-* / local-stack projects."
            exit 1
          fi
          npx playwright test --list --project=preview-recovery-windows-read-only --project=preview-recovery-windows-mobile --project=preview-recovery-windows-mutating --project=preview-recovery-windows-credit | grep -q "recovery-windows/"
          npx playwright test --list --project=local-stack | grep -q "local-stack/"

      - name: Secrets audit — SUPABASE_SERVICE_ROLE_KEY must never reach the client bundle
        run: npm run check:secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

  rls-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run RLS policy tests against a real Postgres
        run: npm run test:rls
        env:
          RLS_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
